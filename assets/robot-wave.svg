<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#31506b" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Animated robot">
  <defs>
    <linearGradient id="robot-shell" x1="5" y1="5" x2="19" y2="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9f3ff"/>
      <stop offset="1" stop-color="#67c9f5"/>
    </linearGradient>
    <linearGradient id="robot-ear" x1="3" y1="10" x2="6" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe66d"/>
      <stop offset="1" stop-color="#ffad52"/>
    </linearGradient>
    <style>
      @keyframes robot-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
      @keyframes robot-antenna{0%,80%,100%{transform:rotate(0)}86%{transform:rotate(-18deg)}92%{transform:rotate(14deg)}}
      @keyframes robot-blink{0%,42%,46%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}
      #robot [data-bob]{transform-box:fill-box;transform-origin:center;animation:robot-bob 1800ms ease-in-out infinite}
      #robot [data-antenna]{transform-box:fill-box;transform-origin:50% 100%;animation:robot-antenna 2600ms ease-in-out infinite}
      #robot [data-eyes]{transform-box:fill-box;transform-origin:center;animation:robot-blink 3200ms ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){#robot [data-bob],#robot [data-antenna],#robot [data-eyes]{animation:none}}
    </style>
  </defs>
  <g id="robot" data-bob="motion">
    <g data-antenna="motion">
      <path d="M12 5.2V3.6"/>
      <circle cx="12" cy="2.8" r="1" fill="#ffcf4a" stroke="#b8772f"/>
    </g>
    <path d="M4.6 9.2H3.5a1 1 0 0 0-1 1v3.2a1 1 0 0 0 1 1h1.1M19.4 9.2h1.1a1 1 0 0 1 1 1v3.2a1 1 0 0 1-1 1h-1.1" fill="url(#robot-ear)"/>
    <rect x="4.6" y="5.2" width="14.8" height="13.8" rx="4" fill="url(#robot-shell)"/>
    <path d="M7.1 7.8c1-.9 2.4-1.4 4-1.4" stroke="#fff" stroke-opacity=".75"/>
    <g data-eyes="motion" fill="#31506b" stroke="none">
      <ellipse cx="9" cy="11.2" rx="1.15" ry="1.5"/>
      <ellipse cx="15" cy="11.2" rx="1.15" ry="1.5"/>
    </g>
    <path d="M9.3 14.7c.8.8 1.7 1.2 2.7 1.2s1.9-.4 2.7-1.2" stroke="#31506b" stroke-width="1.2"/>
    <circle cx="8.6" cy="10.7" r=".35" fill="#fff" stroke="none"/>
    <circle cx="14.6" cy="10.7" r=".35" fill="#fff" stroke="none"/>
  </g>
</svg>
